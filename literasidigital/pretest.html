                let score = 0;
                quizData.forEach((q, idx) => {
                    if (answersRef.current[idx] === q.correct) {
                        score += 5; // 20 soal x 5 poin = 100
                    }
                });
                return score;
            };

            const handleSubmitQuiz = async (forceSubmit = false) => {
                // Mencegah pengiriman berulang
                if (isSubmittedRef.current) return;
                isSubmittedRef.current = true;
                
                setIsSubmitting(true);
                const finalScore = calculateScore();
                
                // Format Waktu & Jam Pengerjaan
                const now = new Date();
                const tglWaktu = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');

                const payload = {
                    tglWaktu: tglWaktu,
                    nis: nis,
                    nama: studentName,
                    kelas: studentClass,
                    nilai: finalScore,
                    catatan: forceSubmit ? "Terkirim Otomatis (Pelanggaran Tab > 3x)" : "Selesai Normal"
                };

                try {
                    await fetch(DEFAULT_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    setSubmitStatus('success');
                } catch (error) {
                    console.error("Gagal mengirim data:", error);
                    setSubmitStatus('error');
                }

                setIsSubmitting(false);
                setStep('result');
            };

            return (
                <div className="bg-white border border-slate-200 rounded-2xl shadow-xl p-6 sm:p-8">
                    {/* Header */}
                    <div className="flex flex-wrap items-center justify-between border-b border-slate-200 pb-4 mb-6 gap-2">
                        <div>
                            <h1 className="text-xl font-bold text-slate-800">Kuis Uji Nalar Kritis Murid</h1>
                            <p className="text-xs text-slate-500">Literasi Digital, Hukum Siber, & Kecerdasan Artifisial</p>
                        </div>
                        {step === 'quiz' && (
                            <div className="flex items-center space-x-3">
                                <span className={`text-xs px-3 py-1 rounded-full font-bold border ${
                                    violations > 0 ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-100 text-slate-700 border-slate-200'
                                }`}>
                                    Pelanggaran Tab: {violations} / 3
                                </span>
                                <span className="text-sm font-semibold bg-blue-50 text-blue-700 border border-blue-200 px-3 py-1 rounded-full">
                                    Soal {currentQuestion + 1} / {quizData.length}
                                </span>
                            </div>
                        )}
                    </div>

                    {/* Step 1: Form Identitas & Status Database */}
                    {step === 'welcome' && (
                        <form onSubmit={handleStart} className="space-y-4">
                            <div className="flex items-center justify-between p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
                                <div className="flex items-center space-x-2">
                                    <div className={`w-2.5 h-2.5 rounded-full ${
                                        dbConnected ? 'bg-emerald-500' : 'bg-rose-500'
                                    }`}></div>
                                    <span className="text-xs font-semibold text-slate-700">Status Database:</span>
                                </div>
                                <span className={`text-xs font-bold ${
                                    dbConnected ? 'text-emerald-600' : 'text-rose-600'
                                }`}>
                                    {dbStatusText}
                                </span>
                            </div>

                            <h2 className="text-base font-semibold text-slate-800 pt-2">Identitas Peserta</h2>

                            <div>
                                <label className="block text-xs font-medium text-slate-600 mb-1">NIS (Nomor Induk Siswa) *</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={nis}
                                    onChange={(e) => setNis(e.target.value)}
                                    placeholder="Masukkan NIS Anda"
                                    className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-600 mb-1">Nama Lengkap *</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={studentName}
                                    onChange={(e) => setStudentName(e.target.value)}
                                    placeholder="Masukkan Nama Lengkap Anda"
                                    className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-600 mb-1">Kelas *</label>
                                <select 
                                    value={studentClass}
                                    onChange={(e) => setStudentClass(e.target.value)}
                                    className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                                >
                                    <option value="X DKV 1">X DKV 1</option>
                                    <option value="X DKV 2">X DKV 2</option>
                                    <option value="X PM 1">X PM 1</option>
                                    <option value="X PM 2">X PM 2</option>
                                </select>
                            </div>

                            <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs leading-relaxed">
                                ⚠️ <strong>Aturan Pengerjaan:</strong> Dilarang berpindah tab browser atau keluar dari aplikasi. Jika terdeteksi pindah tab lebih dari 3 kali, kuis akan otomatis terkirim secara paksa.
                            </div>

                            <button 
                                type="submit" 
                                disabled={!dbConnected}
                                className={`w-full mt-4 font-semibold py-3 rounded-xl transition duration-200 shadow-md ${
                                    dbConnected 
                                        ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/20' 
                                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                }`}
                            >
                                {dbConnected 
                                    ? "Mulai Kerjakan Kuis" 
                                    : "Gagal Terhubung ke Database"}
                            </button>
                        </form>
                    )}

                    {/* Step 2: Halaman Soal */}
                    {step === 'quiz' && (
                        <div>
                            <div className="mb-6">
                                <span className={`inline-block px-2.5 py-1 text-[11px] font-bold rounded-md mb-2 ${
                                    quizData[currentQuestion].type === 'pg' 
                                        ? 'bg-blue-100 text-blue-700 border border-blue-200' 
                                        : 'bg-purple-100 text-purple-700 border border-purple-200'
                                }`}>
                                    {quizData[currentQuestion].type === 'pg' ? 'Pilihan Ganda' : 'Benar / Salah'}
                                </span>
                                
                                <h2 className="text-sm sm:text-base font-medium text-slate-800 leading-relaxed whitespace-pre-line mb-4">
                                    {quizData[currentQuestion].question}
                                </h2>

                                <div className="space-y-3">
                                    {quizData[currentQuestion].options.map((option, idx) => {
                                        const isSelected = answers[currentQuestion] === idx;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleSelectOption(currentQuestion, idx)}
                                                className={`w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm transition duration-150 flex items-center justify-between ${
                                                    isSelected 
                                                        ? 'bg-blue-50 border-blue-500 text-blue-900 font-medium' 
                                                        : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                                }`}
                                            >
                                                <span>{option}</span>
                                                <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                                                    isSelected ? 'border-blue-600 bg-blue-600' : 'border-slate-300'
                                                }`}>
                                                    {isSelected && <div className="w-1.5 h-1.5 bg-white rounded-full"></div>}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Navigasi Soal */}
                            <div className="flex items-center justify-between border-t border-slate-200 pt-4">
                                <button
                                    disabled={currentQuestion === 0}
                                    onClick={() => setCurrentQuestion(currentQuestion - 1)}
                                    className="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-xs font-medium border border-slate-200 disabled:opacity-40 hover:bg-slate-200"
                                >
                                    Sebelumnya
                                </button>
                                
                                {currentQuestion < quizData.length - 1 ? (
                                    <button
                                        onClick={() => setCurrentQuestion(currentQuestion + 1)}
                                        className="px-5 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700"
                                    >
                                        Selanjutnya
                                    </button>
                                ) : (
                                    <button
                                        disabled={isSubmitting}
                                        onClick={() => handleSubmitQuiz(false)}
                                        className="px-6 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700 disabled:opacity-50"
                                    >
                                        {isSubmitting ? "Mengirim..." : "Selesai & Kirim"}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Step 3: Hasil Akhir */}
                    {step === 'result' && (
                        <div className="text-center py-6">
                            <div className="inline-block p-4 bg-emerald-100 border border-emerald-200 rounded-full mb-3 text-emerald-600">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                </svg>
                            </div>

                            <h2 className="text-2xl font-bold text-slate-800 mb-1">
                                {isAutoSubmitted ? "Kuis Terkirim Otomatis!" : "Terima Kasih, Kuis Selesai!"}
                            </h2>
                            <p className="text-xs text-slate-500 mb-6">
                                {studentName} | NIS: {nis} | Kelas: {studentClass}
                            </p>

                            <div className="bg-blue-50 border border-blue-100 rounded-2xl p-6 max-w-xs mx-auto mb-6">
                                <span className="text-xs text-blue-600 font-semibold uppercase tracking-wider">Nilai Akhir Anda</span>
                                <div className="text-5xl font-extrabold text-blue-700 mt-2">{calculateScore()}</div>
                                <p className="text-xs text-slate-500 mt-2">dari total nilai maksimum 100</p>
                            </div>

                            {submitStatus === 'success' && (
                                <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs rounded-xl max-w-md mx-auto">
                                    ✓ Nilai dan data Anda telah berhasil tersimpan di Google Spreadsheet!
                                </div>
                            )}

                            {submitStatus === 'error' && (
                                <div className="p-3 bg-rose-50 border border-rose-200 text-rose-800 text-xs rounded-xl max-w-md mx-auto">
                                    ⚠️ Terjadi kendala saat mengirim data ke spreadsheet. Silakan informasikan ke pengawas/guru.
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
